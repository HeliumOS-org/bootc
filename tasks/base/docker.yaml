- name: Install Docker dnf repository
  shell:
    cmd: |
      dnf config-manager \
        --add-repo=https://download.docker.com/linux/rhel/docker-ce.repo

- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
